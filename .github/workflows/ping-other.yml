name: ping other & update readme

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  # need this so the gh cli can read the release assets!
  pull-requests: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: update version strings in readme
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_NAME="${{ github.event.release.name }}"
          CURRENT_DATE=$(date +"%d/%m/%y")
          
          # strictly extract the version number (e.g. 9.1.48 or 9.1.58.1126) no matter how the title is formatted!
          VERSION=$(echo "$RELEASE_NAME" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?' | head -n 1)
          
          echo "extracted version $VERSION from release name."
          echo "checking uploaded files to confirm if it's testflight or stable..."
          
          # fetch the list of files attached to this exact release
          ASSET_NAMES=$(gh release view "${{ github.event.release.tag_name }}" --json assets --jq '.assets[].name')
          
          # check the file names for ur specific prefixes
          if echo "$ASSET_NAMES" | grep -q "TestFlight-ES"; then
             echo "found TestFlight-ES in the file names! updating the beta text..."
             sed -i -E "s/Current TestFlight BETA Version \`[0-9.]+\`/Current TestFlight BETA Version \`$VERSION\`/g" README.md
          elif echo "$ASSET_NAMES" | grep -q "EeveeSpotify"; then
             echo "found regular EeveeSpotify in the file names! updating the stable text..."
             sed -i -E "s/Current Stable Version [0-9.]+/Current Stable Version $VERSION/g" README.md
          else
             echo "couldn't find a matching prefix in the files! skipping version update just to be safe..."
          fi
          
          # always update the date globally
          echo "updating the last updated date to $CURRENT_DATE"
          sed -i -E "s/\*\*Last updated \`[0-9]{2}\/[0-9]{2}\/[0-9]{2}\`/\*\*Last updated \`$CURRENT_DATE\`/g" README.md

      - name: commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          # use skip ci so it doesnt trigger other stuff randomly
          git diff --cached --quiet || git commit -m "docs: update readme to version $VERSION [skip ci]"
          git push

      - name: send repository dispatch
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/estrogencat/EeveeSpotifyReincarnated/dispatches \
            -d '{"event_type": "pingpongmotherfucker"}'
