name: ping other & update readme

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: update version strings in readme
        run: |
          # grab the release name that triggered this workflow
          RELEASE_NAME="${{ github.event.release.name }}"
          CURRENT_DATE=$(date +"%d/%m/%y")
          
          # extract just the spotify version from before the first space
          VERSION=$(echo "$RELEASE_NAME" | awk '{print $1}')
          
          echo "Updating README with date: $CURRENT_DATE and version: $VERSION"
          
          # update the date
          sed -i -E "s/\*\*Last updated \`[0-9]{2}\/[0-9]{2}\/[0-9]{2}\`/\*\*Last updated \`$CURRENT_DATE\`/g" README.md
          
          # check if it has 4 segments (testflight) or 3 segments (stable)
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
             echo "looks like a testflight beta!"
             sed -i -E "s/Current TestFlight BETA Version \`[0-9.]+\`/Current TestFlight BETA Version \`$VERSION\`/g" README.md
          else
             echo "looks like a stable release!"
             sed -i -E "s/Current Stable Version [0-9.]+/Current Stable Version $VERSION/g" README.md
          fi

      - name: commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          # skip ci so it doesnt accidentally trigger other workflows infinitely
          git diff --cached --quiet || git commit -m "docs: update readme versions to $VERSION [skip ci]"
          git push

      - name: send repository dispatch
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/estrogencat/EeveeSpotifyReincarnated/dispatches \
            -d '{"event_type": "pingpongmotherfucker"}'
