name: Ping other repo & Update README

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # tells github to check out the branch instead of the detached tag!
          ref: ${{ github.event.release.target_commitish || github.ref }}

      - name: update version strings in readme
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_NAME="${{ github.event.release.name }}"
          TAG_NAME="${{ github.event.release.tag_name }}"
          CURRENT_DATE=$(date +"%d/%m/%y")
          
          # if run manually, event data is empty! let's fetch the absolute latest release to be safe :3
          if [ -z "$RELEASE_NAME" ]; then
            echo "manual run detected! pulling the latest release from the repo..."
            RELEASE_NAME=$(gh release view --json name -q '.name')
            TAG_NAME=$(gh release view --json tagName -q '.tagName')
          fi
          
          # strictly extract the version number (e.g. 9.1.48 or 9.1.58.1126)
          VERSION=$(echo "$RELEASE_NAME" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?' | head -n 1)
          
          # just in case the release name doesn't have the version, check the tag too!
          if [ -z "$VERSION" ]; then
            VERSION=$(echo "$TAG_NAME" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?' | head -n 1)
          fi
          
          echo "extracted version $VERSION from release $TAG_NAME."
          echo "checking uploaded files to confirm if it's testflight or stable..."
          
          # fetch the list of files attached to this exact release
          ASSET_NAMES=$(gh release view "$TAG_NAME" --json assets --jq '.assets[].name')
          
          # super-forgiving regex that matches whether backticks exist or not!
          if echo "$ASSET_NAMES" | grep -q "TestFlight-ES"; then
             echo "found TestFlight-ES in the file names! updating the beta text..."
             sed -i -E 's|Current TestFlight BETA Version [`0-9.]*|Current TestFlight BETA Version `'"$VERSION"'`|g' README.md
          elif echo "$ASSET_NAMES" | grep -q "EeveeSpotify"; then
             echo "found regular EeveeSpotify in the file names! updating the stable text..."
             sed -i -E 's|Current Stable Version [`0-9.]*|Current Stable Version `'"$VERSION"'`|g' README.md
          else
             echo "couldn't find a matching prefix in the files! skipping version update just to be safe..."
          fi
          
          # protect the date backticks the exact same way
          echo "updating the last updated date to $CURRENT_DATE"
          sed -i -E 's|\*\*Last updated [`0-9/]*|\*\*Last updated `'"$CURRENT_DATE"'`|g' README.md

      - name: commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: update readme to version $VERSION [skip ci]"
          git push

      - name: send repository dispatch
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/estrogencat/EeveeSpotifyReincarnated/dispatches \
            -d '{"event_type": "pingpongmotherfucker"}'
